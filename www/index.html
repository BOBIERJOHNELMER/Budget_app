<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b132b" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: file: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; img-src 'self' data: blob: file:; connect-src 'self' file: https: http://127.0.0.1:8002;" />
    <title>SalaryWise</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Budgeting</p>
          <h1>SalaryWise</h1>
        </div>
        <button class="icon-button" id="theme-toggle" aria-label="Toggle theme">
          <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        </button>
      </header>

      <main id="page-root" aria-live="polite"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item" data-route="#/dashboard" aria-label="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 10.5 12 3.8l8.5 6.7V18a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 18z" />
          </svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-route="#/shop" aria-label="Shop">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 5h2l1.3 8.2A2 2 0 0 0 8.8 15h7.4a2 2 0 0 0 2-1.6L19.5 7H6.1" />
            <circle cx="10" cy="18" r="1.4" />
            <circle cx="17" cy="18" r="1.4" />
          </svg>
          <span>Shop</span>
        </button>
        <button class="nav-item" data-route="#/scan" aria-label="Scan shelf price">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2" />
            <path d="M7 9h10v6H7zM9 12h6" />
          </svg>
          <span>Scan</span>
        </button>
        <button class="nav-item" data-route="#/profile" aria-label="Profile">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4" />
            <path d="M5 19c1.5-3.1 4.2-4.6 7-4.6s5.5 1.5 7 4.6" />
          </svg>
          <span>Profile</span>
        </button>
      </nav>
    </div>

    <div id="modal-root" aria-live="assertive"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
